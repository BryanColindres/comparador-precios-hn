<!doctype html>
<html lang="es" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Precios HN</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1317">
<style>
:root{
  --bg:#f3f5f9;--sf:#fff;--sf2:#eceff5;--tx:#131820;--mu:#667085;--bd:#e3e7ee;
  --pz:#2a68e6;--pzs:#e7efff;--co:#e0560d;--cos:#ffefe5;
  --ok:#0f7b57;--oks:#def5ea;--bad:#c2301d;--bads:#fdeae7;--ac:#131820;--acx:#fff;
  --sh:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.07);--r:18px;--nav:68px;
}
:root[data-theme=dark]{--bg:#0d1117;--sf:#161b22;--sf2:#1f2630;--tx:#e9edf3;--mu:#97a3b4;--bd:#273040;
  --pz:#6b9bff;--pzs:#16233f;--co:#ff8a4c;--cos:#3a2216;--ok:#46d39a;--oks:#0f2e24;--bad:#ff7d6e;--bads:#3a1b17;
  --ac:#e9edf3;--acx:#0d1117;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
@media(prefers-color-scheme:dark){:root[data-theme=auto]{--bg:#0d1117;--sf:#161b22;--sf2:#1f2630;--tx:#e9edf3;--mu:#97a3b4;--bd:#273040;
  --pz:#6b9bff;--pzs:#16233f;--co:#ff8a4c;--cos:#3a2216;--ok:#46d39a;--oks:#0f2e24;--bad:#ff7d6e;--bads:#3a1b17;
  --ac:#e9edf3;--acx:#0d1117;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 16px)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid var(--pz);outline-offset:2px;border-radius:8px}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}

/* Encabezado */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--bd)}
.top .wrap{display:flex;align-items:center;gap:12px;height:58px}
.logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--pz),var(--co));box-shadow:0 4px 12px rgba(42,104,230,.35)}
.logo svg{width:20px;height:20px;stroke-width:2.4}
.brand{flex:1;min-width:0}.brand h1{margin:0;font-size:17px;letter-spacing:-.01em;line-height:1.1}
.brand p{margin:2px 0 0;font-size:11.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--mu);background:var(--sf);
  border:1px solid var(--bd);transition:transform .15s}
.ib:active{transform:scale(.92)}

/* Vistas */
.view{display:none;padding-top:14px}
.view.on{display:block;animation:in .28s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:20px 4px 8px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.muted{color:var(--mu)}.small{font-size:12px}
.pz{--c:var(--pz);--cs:var(--pzs)}.co{--c:var(--co);--cs:var(--cos)}

/* Resumen */
.hero{padding:16px}
.hero .t{font-size:13px;color:var(--mu);margin-bottom:6px}
.hero .big{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.seg{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--sf2);margin:14px 0 10px}
.seg i{display:block;height:100%;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.seg .a{background:var(--pz)}.seg .m{background:var(--bd)}.seg .b{background:var(--co)}
.leg{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600}
.leg .a{color:var(--pz)}.leg .b{color:var(--co)}.leg .m{color:var(--mu)}

/* Chips y campos */
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 14px;margin:0 -14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;background:var(--sf);border:1px solid var(--bd);font-weight:600;
  font-size:13.5px;color:var(--mu);transition:all .15s;display:inline-flex;gap:6px;align-items:center}
.chip b{font-size:11.5px;background:var(--sf2);color:var(--mu);padding:1px 7px;border-radius:99px;font-weight:700}
.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.chip.on b{background:rgba(255,255,255,.2);color:inherit}
:root[data-theme=dark] .chip.on b{background:rgba(0,0,0,.15)}
.chip:active{transform:scale(.96)}
.chip.pz.on{background:var(--pz);border-color:var(--pz);color:#fff}
.chip.co.on{background:var(--co);border-color:var(--co);color:#fff}
.field{position:relative}
.field svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mu);pointer-events:none}
.field input{width:100%;height:50px;border-radius:15px;border:1px solid var(--bd);background:var(--sf);padding:0 44px;
  box-shadow:var(--sh);outline:none;transition:border-color .15s}
.field input:focus{border-color:var(--pz)}
.field .x{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;
  display:none;place-items:center;color:var(--mu)}
.field.has .x{display:grid}
select.sel{width:100%;height:50px;border-radius:15px;border:1px solid var(--bd);background:var(--sf);padding:0 14px;
  box-shadow:var(--sh);appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 14px center}

/* Lista */
.grp{margin-top:6px}
.grp h2{display:flex;align-items:center;gap:8px}
.grp h2::after{content:"";flex:1;height:1px;background:var(--bd)}
.row{display:block;width:100%;text-align:left;padding:13px 14px;margin-bottom:10px;transition:transform .12s,box-shadow .2s}
.row:active{transform:scale(.985)}
.row .nm{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:9px}
.row .nm b{font-size:15.5px}.row .nm small{color:var(--mu);font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.p{position:relative;border-radius:13px;padding:9px 11px;background:var(--cs);border:1.5px solid transparent;min-width:0}
.p .st{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--c);text-transform:uppercase;letter-spacing:.04em}
.p .v{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em;margin-top:1px}
.p .v em{font-style:normal;font-size:11.5px;font-weight:600;color:var(--mu);margin-left:3px}
.p .pn{display:block;font-size:11px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.p s{font-size:11.5px;color:var(--mu);margin-left:4px;font-weight:500}
.p.win{background:var(--oks);border-color:var(--ok)}
.p.win .st{color:var(--ok)}
.p.none{background:var(--sf2);opacity:.75}.p.none .v{color:var(--mu);font-size:16px}
a.p:active{transform:scale(.98)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px}
.badge.ok{background:var(--oks);color:var(--ok)}.badge.bad{background:var(--bads);color:var(--bad)}
.badge.eq{background:var(--sf2);color:var(--mu)}.badge.info{background:var(--sf2);color:var(--mu)}
.delta{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.foot{padding:18px 6px;font-size:12px;color:var(--mu);text-align:center}

/* Buscar */
.tools{display:flex;gap:8px;align-items:center;margin-top:2px}
.tools select{flex:1;height:40px;border-radius:12px;border:1px solid var(--bd);background:var(--sf);padding:0 10px;font-size:13.5px}
.cnt{font-size:12.5px;color:var(--mu);white-space:nowrap}
.item{display:flex;gap:12px;padding:12px;margin-bottom:10px}
.im{width:76px;height:76px;flex:none;border-radius:13px;background:#fff;display:grid;place-items:center;overflow:hidden;border:1px solid var(--bd)}
.im img{width:100%;height:100%;object-fit:contain}
.bd{flex:1;min-width:0}
.bd h3{margin:0;font-size:14.5px;line-height:1.28;font-weight:650;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 8px}
.alt{font-size:12px;color:var(--mu);margin:-2px 0 6px}
.item .two{gap:7px}
.item .p .v{font-size:17px}
.acts{display:flex;gap:8px;margin-top:10px}
.btn{height:36px;padding:0 13px;border-radius:11px;font-weight:650;font-size:13px;display:inline-flex;align-items:center;gap:6px;
  background:var(--sf2);color:var(--tx);transition:transform .12s,background .15s}
.btn:active{transform:scale(.95)}
.btn.pri{background:var(--ac);color:var(--acx)}
.btn.in{background:var(--oks);color:var(--ok)}
.btn svg{width:16px;height:16px}
.more{display:block;margin:6px auto 0;height:44px;padding:0 24px;border-radius:14px;background:var(--sf);border:1px solid var(--bd);font-weight:650}
.empty{text-align:center;padding:34px 18px;color:var(--mu)}
.empty b{display:block;color:var(--tx);font-size:16px;margin-bottom:6px}
.sug{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}

/* Calculadora */
.cal{padding:16px;display:grid;gap:14px}
.lab{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);margin-bottom:6px;display:block}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.num{display:flex;align-items:center;height:56px;border-radius:15px;border:1px solid var(--bd);background:var(--sf2);padding:0 14px;gap:6px}
.num span{font-weight:800;color:var(--mu);font-size:18px}
.num input{flex:1;min-width:0;width:100%;border:0;background:none;outline:none;font-size:24px;font-weight:800;letter-spacing:-.02em}
.num:focus-within{border-color:var(--pz)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:42px;height:42px;border-radius:12px;background:var(--sf);border:1px solid var(--bd);display:grid;place-items:center}
.step button:active{transform:scale(.92)}
.step input{width:74px;text-align:center;height:56px;border-radius:15px;border:1px solid var(--bd);background:var(--sf2);font-size:22px;font-weight:800;outline:none}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}
.res{padding:18px;margin-top:14px;display:none}
.res.on{display:block;animation:in .3s ease both}
.res .big{font-size:38px;font-weight:850;letter-spacing:-.03em;line-height:1}
.res .sub{color:var(--mu);margin-top:4px;font-size:13.5px}
.bars{display:grid;gap:12px;margin:18px 0 6px}
.br{display:grid;gap:5px}
.br .l{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:650}
.br .l span:last-child{font-weight:800;font-size:15px}
.br .t{height:12px;border-radius:99px;background:var(--sf2);overflow:hidden}
.br .t i{display:block;height:100%;border-radius:99px;background:var(--c,var(--tx));width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.br.me{--c:var(--tx)}
.br small{color:var(--mu);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.verdict{margin-top:14px;padding:12px 14px;border-radius:14px;font-weight:650;font-size:14px}
.verdict.ok{background:var(--oks);color:var(--ok)}.verdict.bad{background:var(--bads);color:var(--bad)}.verdict.eq{background:var(--sf2)}
.note{margin-top:10px;font-size:12.5px;color:var(--mu)}

/* Canasta */
.crow{display:flex;gap:11px;padding:11px;margin-bottom:10px;align-items:center}
.crow .im{width:58px;height:58px}
.crow .bd h3{font-size:13.5px}
.crow .pr{display:flex;gap:10px;margin-top:5px;font-size:12px;font-weight:700}
.crow .pr .pz{color:var(--pz)}.crow .pr .co{color:var(--co)}
.crow .qty{display:flex;align-items:center;gap:2px;flex:none}
.crow .qty button{width:34px;height:34px;border-radius:10px;background:var(--sf2);display:grid;place-items:center}
.crow .qty b{min-width:24px;text-align:center}
.tot{padding:16px;margin:14px 0}
.tot .two{margin-top:10px}
.tot .p .v{font-size:23px}

/* Navegación inferior */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--sf) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--bd)}
.tabbar .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{position:relative;height:52px;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;font-size:11px;font-weight:650;color:var(--mu);transition:color .15s,background .2s}
.tab.on{color:var(--tx);background:var(--sf2)}
.tab.on svg{color:var(--pz)}
.tab .bg{position:absolute;top:2px;right:calc(50% - 22px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;
  background:var(--co);color:#fff;font-size:10.5px;font-weight:800;display:none;place-items:center}
.tab .bg.on{display:grid}

/* Hoja inferior */
#scrim{position:fixed;inset:0;background:rgba(8,12,18,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:720px;margin:0 auto;background:var(--sf);
  border-radius:24px 24px 0 0;max-height:86vh;overflow:auto;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.2,1);
  padding:8px 16px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.25);overscroll-behavior:contain}
#sheet.on{transform:none}
.grab{width:42px;height:5px;border-radius:99px;background:var(--bd);margin:4px auto 12px}
#sheet h3.t{margin:0 0 4px;font-size:19px;letter-spacing:-.01em}
.sline{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--bd);align-items:center}
.sline .im{width:56px;height:56px}
.sline .bd h4{margin:0;font-size:13.5px;line-height:1.3;font-weight:650}
.sline .px{font-weight:800;font-size:16px}
.sline .px em{font-style:normal;font-size:11.5px;color:var(--mu);font-weight:600}
.lnk{display:inline-flex;align-items:center;gap:5px;color:var(--pz);font-weight:650;font-size:13px}
.lnk svg{width:14px;height:14px}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 22px);transform:translate(-50%,20px);
  background:var(--ac);color:var(--acx);padding:11px 18px;border-radius:99px;font-weight:650;font-size:14px;opacity:0;
  pointer-events:none;transition:all .28s;z-index:60;white-space:nowrap;box-shadow:var(--sh)}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media(min-width:720px){body{font-size:16px}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></div>
  <div class="brand"><h1>Precios HN</h1><p id="fechas"></p></div>
  <button class="ib" id="tema" aria-label="Cambiar tema"></button>
</div></header>

<main class="wrap">
  <!-- LISTA -->
  <section class="view on" id="v-lista" aria-label="Lista de productos básicos">
    <div class="card hero" id="hero"></div>
    <div class="chips" id="gchips"></div>
    <div class="field" id="lf"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="lq" type="search" placeholder="Filtrar la lista…" autocomplete="off" aria-label="Filtrar la lista">
      <button class="x" id="lx" aria-label="Borrar"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div id="lista"></div>
    <div class="foot">Precio más bajo encontrado por producto. Toca uno para ver de qué producto se trata.<br>
      Los precios son de la fecha indicada arriba y pueden cambiar: confirma en tienda.</div>
  </section>

  <!-- CALCULADORA -->
  <section class="view" id="v-calc" aria-label="Calculadora">
    <div class="card cal">
      <div><label class="lab" for="cp">Producto</label><select class="sel" id="cp"></select></div>
      <div><span class="lab">Unidad en que te lo venden</span><div class="pills" id="cu"></div></div>
      <div class="grid2">
        <div><label class="lab" for="cpr">Precio en el mercado</label>
          <div class="num"><span>L</span><input id="cpr" type="number" inputmode="decimal" min="0" step="any" placeholder="20.00"></div></div>
        <div><label class="lab" for="cca">Cantidad</label>
          <div class="step"><button id="cm" aria-label="Menos"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
            <input id="cca" type="number" inputmode="decimal" min="0" step="any" value="1">
            <button id="cmas" aria-label="Más"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div></div>
      </div>
    </div>
    <div class="card res" id="res"></div>
    <div class="note" id="cnote"></div>
  </section>

  <!-- BUSCAR -->
  <section class="view" id="v-buscar" aria-label="Buscar">
    <div class="field" id="qf"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar: huevo, leche, aceite…" autocomplete="off" aria-label="Buscar productos">
      <button class="x" id="qx" aria-label="Borrar"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="chips" id="fchips"></div>
    <div class="tools"><select id="ord" aria-label="Ordenar"><option value="rel">Más relevantes</option>
      <option value="precio">Precio: menor a mayor</option><option value="unit">Precio por unidad</option>
      <option value="ahorro">Mayor ahorro entre tiendas</option><option value="az">Nombre A–Z</option></select>
      <span class="cnt" id="cnt"></span></div>
    <div id="out" style="margin-top:12px"></div>
  </section>

  <!-- CANASTA -->
  <section class="view" id="v-canasta" aria-label="Canasta">
    <div id="cart"></div>
  </section>
</main>

<nav class="tabbar" aria-label="Secciones"><div class="in" role="tablist">
  <button class="tab on" data-v="lista" role="tab" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>Lista</button>
  <button class="tab" data-v="calc" role="tab" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="3"/><path d="M8 6h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01M8 18.5h.01M12 18.5h.01M16 18.5h.01"/></svg>Calculadora</button>
  <button class="tab" data-v="buscar" role="tab" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Buscar</button>
  <button class="tab" data-v="canasta" role="tab" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1.4 11a2 2 0 0 1-2 1.7H8.4a2 2 0 0 1-2-1.7L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>Canasta<span class="bg" id="bg"></span></button>
</div></nav>

<div id="scrim"></div>

<script>
"use strict";
const LISTA=__LISTA__,D=__DATA__,PFX=__PFX__,FP="__FP__",FC="__FC__";

/* ───── utilidades ───── */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const ST={p:{n:"Paiz",k:"pz"},c:{n:"La Colonia",k:"co"}};
const SH={lb:"lb",L:"L",u:"u"},LONG={lb:"libra",L:"litro",u:"unidad"};
const money=n=>"L "+(Math.round(n*100)/100).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,",");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const words=s=>norm(s).match(/[a-z0-9]+/g)||[];
const stem=t=>t.length>3&&t.endsWith("s")&&!t.endsWith("ss")?t.slice(0,-1):t;
const SYN={guineo:"banano",chayote:"guisquil",gaseosa:"refresco",pan:"pan"};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const link=(t,r)=>!r?"":/^https?:/.test(r)?r:PFX[t].u+r;
const imgu=(t,r)=>!r?"":/^https?:/.test(r)?r:PFX[t].i+r;
const IC={ext:'<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  chk:'<svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  min:'<svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>',
  find:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  sun:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon:'<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>',
  auto:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18"/><path d="M12 3a9 9 0 0 1 0 18" fill="currentColor"/></svg>'};
let toastT;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),1900)}
const anim=(el,to,fmt)=>{ // cuenta animada del número grande
  if(!window.requestAnimationFrame||matchMedia("(prefers-reduced-motion:reduce)").matches){el.textContent=fmt(to);return}
  const from=parseFloat(el.dataset.v||0)||0,t0=performance.now(),d=450;el.dataset.v=to;
  const f=n=>{const k=Math.min(1,(n-t0)/d),e=1-Math.pow(1-k,3);el.textContent=fmt(from+(to-from)*e);if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)};

/* ───── índice de búsqueda ───── */
const byId=new Map();
D.forEach((x,i)=>{
  x.nm=(x.p||x.c)[7];
  const base=[x.p&&x.p[7],x.c&&x.c[7],x.m,x.id.slice(1)].filter(Boolean).join(" ");
  x.k=" "+words(base).map(stem).join(" ");
  x.w0=stem(words(x.nm)[0]||"");byId.set(x.id,x);
});
const tokens=q=>words(q).map(stem);
const matchTok=(x,t)=>x.k.includes(t)||(SYN[t]&&SYN[t]!==t&&x.k.includes(SYN[t]));

/* ───── tema ───── */
let tema=store.get("phn_tema","auto");
function setTema(t){tema=t;document.documentElement.dataset.theme=t;store.set("phn_tema",t);
  $("#tema").innerHTML=t==="dark"?IC.moon:t==="light"?IC.sun:IC.auto;
  document.querySelector('meta[name=theme-color]').content=(t==="light"||(t==="auto"&&!matchMedia("(prefers-color-scheme:dark)").matches))?"#f3f5f9":"#0d1117"}
$("#tema").onclick=()=>{setTema(tema==="auto"?"dark":tema==="dark"?"light":"auto");toast("Tema: "+({auto:"automático",dark:"oscuro",light:"claro"})[tema])};
setTema(tema);
$("#fechas").textContent=(FP===FC?"Precios al "+FP:"Paiz "+FP+" · La Colonia "+FC);

/* ───── navegación ───── */
function ver(v){
  $$(".view").forEach(s=>s.classList.toggle("on",s.id==="v-"+v));
  $$(".tab").forEach(b=>{const on=b.dataset.v===v;b.classList.toggle("on",on);b.setAttribute("aria-selected",on)});

  if(v==="canasta")pintarCanasta();
}
$$(".tab").forEach(b=>b.onclick=()=>ver(b.dataset.v));

/* ───── hoja inferior ───── */
function hoja(html){$("#sb").innerHTML=html;$("#sheet").classList.add("on");$("#scrim").classList.add("on");$("#sheet").scrollTop=0}
function cerrar(){$("#sheet").classList.remove("on");$("#scrim").classList.remove("on")}
$("#scrim").onclick=cerrar;document.addEventListener("keydown",e=>{if(e.key==="Escape")cerrar()});

/* ───── LISTA ───── */
const PRODG=g=>g==="Verduras"||g==="Frutas";
function comparar(it){ // compara en la misma unidad; si no se puede, deja cada tienda con lo que tiene
  const us=[it.u].concat(PRODG(it.g)&&it.u==="lb"?["u"]:[]);
  for(const u of us){const a=it.p[u],b=it.c[u];
    if(a&&b){const d=a[0]-b[0];return{u,a,b,d,gana:d<0?"p":d>0?"c":"=",pct:Math.abs(d)/Math.max(a[0],b[0])*100}}}
  const a=it.p[it.u]||it.p.u,b=it.c[it.u]||it.c.u;
  return{u:it.u,a,b,d:null,gana:"",pct:0};
}
const CMP=LISTA.map(comparar);
function hero(){
  let p=0,c=0,e=0;CMP.forEach(r=>{if(r.gana==="p")p++;else if(r.gana==="c")c++;else if(r.gana==="=")e++});
  const n=p+c+e||1,lider=p===c?"":p>c?"Paiz":"La Colonia";
  $("#hero").innerHTML=`<div class="t">Hoy en tu lista básica (${n} productos comparables)</div>
   <div class="big">${lider?lider+" gana en más productos":"Van parejos"}</div>
   <div class="seg" aria-hidden="true"><i class="a" style="width:0" data-w="${p/n*100}"></i><i class="m" style="width:0" data-w="${e/n*100}"></i><i class="b" style="width:0" data-w="${c/n*100}"></i></div>
   <div class="leg"><span class="a">Paiz más barato: ${p}</span><span class="m">Igual: ${e}</span><span class="b">La Colonia: ${c}</span></div>`;
  requestAnimationFrame(()=>$$("#hero .seg i").forEach(i=>i.style.width=i.dataset.w+"%"));
}
function pillL(t,s,win,u){
  if(!s)return`<div class="p none ${ST[t].k}"><span class="st">${ST[t].n}</span><span class="v">—</span><span class="pn">no encontrado</span></div>`;
  return`<div class="p ${ST[t].k} ${win?"win":""}"><span class="st">${ST[t].n}${win?" "+IC.chk:""}</span>
   <span class="v">${money(s[0])}<em>/${SH[u]||""}</em></span><span class="pn">${esc(s[1])}</span></div>`;
}
let gSel="Todas";
function pintarLista(){
  const q=norm($("#lq").value.trim());
  const grupos=[...new Set(LISTA.map(x=>x.g))];
  $("#gchips").innerHTML=["Todas",...grupos].map(g=>`<button class="chip ${g===gSel?"on":""}" data-g="${esc(g)}">${esc(g)}</button>`).join("");
  let h="";
  grupos.forEach(g=>{
    if(gSel!=="Todas"&&gSel!==g)return;
    const its=LISTA.map((x,i)=>i).filter(i=>LISTA[i].g===g&&(!q||norm(LISTA[i].n).includes(q)))
      .sort((a,b)=>LISTA[a].n.localeCompare(LISTA[b].n,"es"));
    if(!its.length)return;
    h+=`<div class="grp"><h2>${esc(g)}</h2>`+its.map(i=>{
      const it=LISTA[i],r=CMP[i];
      const ub=r.u,ua=it.p[it.u]?it.u:"u",uc=it.c[it.u]?it.u:"u";
      let tag="";
      if(r.gana==="=")tag=`<span class="badge eq">Mismo precio</span>`;
      else if(r.gana)tag=`<span class="badge ok">${ST[r.gana].n} ahorra ${money(Math.abs(r.d))} (${r.pct.toFixed(0)}%)</span>`;
      else if(r.a&&r.b)tag=`<span class="badge info">Medidas distintas: ver detalle</span>`;
      return`<button class="card row" data-l="${i}"><div class="nm"><b>${esc(it.n)}</b><small>por ${LONG[it.u]}</small></div>
        <div class="two">${pillL("p",r.a,r.gana==="p",r.gana?ub:ua)}${pillL("c",r.b,r.gana==="c",r.gana?ub:uc)}</div>
        ${tag?`<div class="delta">${tag}</div>`:""}</button>`}).join("")+`</div>`;
  });
  $("#lista").innerHTML=h||`<div class="empty"><b>Sin resultados</b>Prueba con otra palabra o usa la pestaña Buscar.</div>`;
  $("#lf").classList.toggle("has",!!$("#lq").value);
}
$("#gchips").onclick=e=>{const b=e.target.closest("[data-g]");if(!b)return;gSel=b.dataset.g;pintarLista()};
$("#lq").oninput=pintarLista;$("#lx").onclick=()=>{$("#lq").value="";pintarLista();$("#lq").focus()};
$("#lista").onclick=e=>{const b=e.target.closest("[data-l]");if(b)detalleLista(+b.dataset.l)};

function detalleLista(i){
  const it=LISTA[i];let h=`<h3 class="t">${esc(it.n)}</h3><div class="muted small">Se muestra el producto más barato por ${LONG[it.u]} de cada tienda y el precio típico de ${esc(it.n.toLowerCase())}.</div>`;
  ["p","c"].forEach(t=>{
    const m=it[t];const us=Object.keys(m);
    if(!us.length){h+=`<div class="sline"><div class="bd"><h4 style="color:var(--mu)">${ST[t].n}: no se encontró este producto</h4></div></div>`;return}
    us.forEach(u=>{const s=m[u];
      h+=`<div class="sline"><div class="im">${s[6]?`<img loading="lazy" referrerpolicy="no-referrer" src="${esc(imgu(t,s[6]))}" alt="" onerror="this.remove()">`:""}</div>
      <div class="bd"><span class="badge info" style="background:var(--${ST[t].k==="pz"?"pzs":"cos"});color:var(--${ST[t].k==="pz"?"pz":"co"})">${ST[t].n}</span>
      <h4 style="margin-top:5px">${esc(s[1])}</h4>
      <div class="px">${money(s[0])} <em>por ${LONG[u]}</em></div>
      <div class="muted small">Empaque ${s[5]||""}: ${money(s[2])} · típico ${money(s[3])} (${s[4]} productos)</div>
      ${s[7]?`<a class="lnk" href="${esc(link(t,s[7]))}" target="_blank" rel="noopener">Ver en ${ST[t].n} ${IC.ext}</a>`:""}</div></div>`});
  });
  h+=`<div class="acts"><button class="btn pri" data-bus="${esc(it.n.split(" ")[0].replace(/[·/(]/g,""))}">${IC.find} Buscar más ${esc(it.n.split(" ")[0].toLowerCase())}</button>
    <button class="btn" data-calc="${i}">Usar en calculadora</button></div>`;
  hoja(h);
}
$("#sb").onclick=e=>{
  const b=e.target.closest("[data-bus]");if(b){cerrar();irBuscar(b.dataset.bus);return}
  const c=e.target.closest("[data-calc]");if(c){cerrar();ver("calc");$("#cp").value=c.dataset.calc;pintarUnidades();calc();$("#cpr").focus();return}
  const a=e.target.closest("[data-add]");if(a){agregar(a.dataset.add);return}
};

/* ───── CALCULADORA ───── */
const UN={lb:[["lb",1],["kg",2.20462],["g",1/453.592],["oz",1/16]],L:[["litro",1],["ml",.001]],u:[["unidad",1],["docena",12]]};
function unidadesDe(it){
  const a=UN[it.u].map(([k,f])=>({k,f,base:it.u}));
  if(PRODG(it.g)&&it.u==="lb")a.push({k:"unidad",f:1,base:"u"});return a;
}
/* Función pura: compara lo que cobra el mercado con cada tienda en la misma medida. */
function calcular(it,precio,cant,u){
  if(!(precio>0&&cant>0))return null;
  const base=u.base,mer=precio/(cant*u.f),r={base,mer,t:[]};
  ["p","c"].forEach(t=>{
    const s=it[t][base];
    if(!s){const o=Object.keys(it[t])[0];r.t.push({t,sin:true,otra:o?{u:o,s:it[t][o]}:null});return}
    const d=mer-s[0];r.t.push({t,s,d,pct:Math.abs(d)/Math.max(mer,s[0])*100});
  });return r;
}
const ORD=LISTA.map((x,i)=>i).sort((a,b)=>LISTA[a].n.localeCompare(LISTA[b].n,"es"));
$("#cp").innerHTML=ORD.map(i=>`<option value="${i}">${esc(LISTA[i].n)}</option>`).join("");
let uSel=0;
function pintarUnidades(){
  const it=LISTA[+$("#cp").value],us=unidadesDe(it);uSel=Math.min(uSel,us.length-1);
  if(!us[uSel])uSel=0;
  $("#cu").innerHTML=us.map((u,i)=>`<button class="chip ${i===uSel?"on":""}" data-u="${i}">${u.k}</button>`).join("");
}
function calc(){
  const it=LISTA[+$("#cp").value],us=unidadesDe(it),u=us[uSel]||us[0];
  const precio=parseFloat($("#cpr").value),cant=parseFloat($("#cca").value),r=calcular(it,precio,cant,u);
  const box=$("#res");
  if(!r){box.classList.remove("on");$("#cnote").textContent="Escribe el precio que te dan y cuánto te dan por ese precio.";return}
  $("#cnote").textContent=u.base==="u"&&it.u==="lb"?"Por unidad solo se compara con tiendas que lo venden por unidad: no se puede pasar de unidades a libras sin saber cuánto pesa cada una.":"";
  const filas=[{t:"m",l:"Mercado",v:r.mer,n:`${money(precio)} por ${cant} ${u.k}`}]
    .concat(r.t.filter(x=>x.s).map(x=>({t:x.t,l:ST[x.t].n,v:x.s[0],n:x.s[1]})));
  const mx=Math.max(...filas.map(f=>f.v));
  let h=`<div class="big" id="bigv" data-v="0">${money(r.mer)}</div><div class="sub">por ${LONG[r.base]} en el mercado</div><div class="bars">`;
  h+=filas.map(f=>`<div class="br ${f.t==="m"?"me":ST[f.t].k}"><div class="l"><span>${f.l}</span><span>${money(f.v)}</span></div>
    <div class="t"><i data-w="${f.v/mx*100}"></i></div><small>${esc(f.n)}</small></div>`).join("")+`</div>`;
  const dif=r.t.filter(x=>x.s);
  r.t.filter(x=>x.sin).forEach(x=>{
    h+=`<div class="note">${ST[x.t].n}: ${x.otra?`solo lo vende por ${LONG[x.otra.u]} (${money(x.otra.s[0])}), no es comparable con tu medida.`:"no se encontró este producto."}</div>`;
  });
  if(dif.length){
    const bar=dif.filter(x=>x.d>0.004),bar2=dif.filter(x=>x.d<-0.004);
    if(dif.every(x=>Math.abs(x.d)<=0.004))h+=`<div class="verdict eq">Mismo precio que en las tiendas.</div>`;
    else if(bar2.length===dif.length){const m=bar2.sort((a,b)=>b.d-a.d)[0];h+=`<div class="verdict ok">El mercado es más barato: ahorras ${money(-m.d)} por ${LONG[r.base]} frente a ${ST[m.t].n} (${m.pct.toFixed(0)}%).</div>`}
    else if(bar.length===dif.length){const m=bar.sort((a,b)=>a.d-b.d)[0];h+=`<div class="verdict bad">Más caro que en ${ST[m.t].n}: pagas ${money(m.d)} más por ${LONG[r.base]} (${m.pct.toFixed(0)}%).</div>`}
    else h+=`<div class="verdict eq">Más barato que ${bar2.map(x=>ST[x.t].n).join(" y ")}, más caro que ${bar.map(x=>ST[x.t].n).join(" y ")}.</div>`;
  }
  box.innerHTML=h;box.classList.add("on");
  anim($("#bigv"),r.mer,money);
  requestAnimationFrame(()=>$$("#res .br .t i").forEach(i=>i.style.width=i.dataset.w+"%"));
}
$("#cp").onchange=()=>{uSel=0;pintarUnidades();calc()};
$("#cu").onclick=e=>{const b=e.target.closest("[data-u]");if(!b)return;uSel=+b.dataset.u;pintarUnidades();calc()};
["cpr","cca"].forEach(i=>$("#"+i).oninput=calc);
$("#cm").onclick=()=>{const v=parseFloat($("#cca").value)||1;$("#cca").value=Math.max(v>1?v-1:v/2,0.25).toString();calc()};
$("#cmas").onclick=()=>{const v=parseFloat($("#cca").value)||0;$("#cca").value=(v<1?v*2||1:v+1).toString();calc()};

/* ───── BUSCAR ───── */
const B={q:"",f:"todas",o:"rel",n:30};
const SUG=["huevo","leche","pollo","arroz","aceite","café","azúcar","frijol","queso","pan","jabón","detergente"];
function buscar(){
  const ts=tokens(B.q);
  const base=ts.length?D.filter(x=>ts.every(t=>matchTok(x,t))):[];
  const cnt={todas:base.length,p:base.filter(x=>x.p).length,c:base.filter(x=>x.c).length,ambas:base.filter(x=>x.p&&x.c).length};
  let r=base.filter(x=>B.f==="todas"||(B.f==="p"&&x.p)||(B.f==="c"&&x.c)||(B.f==="ambas"&&x.p&&x.c));
  const pr=x=>B.f==="c"?x.c[0]:B.f==="p"?x.p[0]:Math.min(x.p?x.p[0]:1e9,x.c?x.c[0]:1e9);
  const up=x=>{const s=B.f==="c"?x.c:B.f==="p"?x.p:(x.p||x.c);return s&&s[2]?s[2]:1e9};
  const ah=x=>x.p&&x.c?Math.abs(x.p[0]-x.c[0])/Math.max(x.p[0],x.c[0]):-1;
  const sc=x=>{let s=0;ts.forEach((t,i)=>{s+=x.k.includes(" "+t)?2:1;if(i===0&&x.w0.startsWith(t))s+=3});return s+(x.p&&x.c?.5:0)};
  r.forEach(x=>x._s=sc(x));
  const cmp={rel:(a,b)=>b._s-a._s||a.nm.localeCompare(b.nm,"es"),precio:(a,b)=>pr(a)-pr(b),unit:(a,b)=>up(a)-up(b),
    ahorro:(a,b)=>ah(b)-ah(a),az:(a,b)=>a.nm.localeCompare(b.nm,"es")}[B.o];
  r.sort(cmp);return{r,cnt};
}
function pillB(t,s,win,main){
  if(!s)return"";
  const off=s[1]>s[0]?`<s>${money(s[1])}</s>`:"";
  return`<a class="p ${ST[t].k} ${win?"win":""}" href="${esc(link(t,s[5]))}" target="_blank" rel="noopener" aria-label="${ST[t].n} ${money(s[0])}">
   <span class="st">${ST[t].n}${win?" "+IC.chk:""}</span><span class="v">${money(s[0])}${off}</span>
   <span class="pn">${s[2]?money(s[2])+" / "+SH[s[3]]:"&nbsp;"}</span></a>`;
}
function tarjeta(x){
  const f=B.f,both=x.p&&x.c,d=both?x.p[0]-x.c[0]:null;
  const foco=f==="c"?"c":f==="p"?"p":(x.p?"p":"c"),s=x[foco],o=x[foco==="p"?"c":"p"],ot=foco==="p"?"c":"p";
  const im=imgu(foco,s[6])||imgu(ot,o&&o[6]);
  let cuerpo;
  if(f==="p"||f==="c"){
    cuerpo=`<div class="two">${pillB(foco,s,false)}${o?`<div class="p ${ST[ot].k}" style="opacity:.8"><span class="st">También en ${ST[ot].n}</span><span class="v">${money(o[0])}</span><span class="pn">${d==null?"":(foco==="p"?d:-d)<0?"Aquí ahorras "+money(Math.abs(d)):(foco==="p"?d:-d)>0?"Allá ahorras "+money(Math.abs(d)):"Mismo precio"}</span></div>`:`<div class="p none"><span class="st">${ST[ot].n}</span><span class="v">—</span><span class="pn">no lo tiene igual</span></div>`}</div>`;
  }else{
    cuerpo=`<div class="two">${x.p?pillB("p",x.p,d!=null&&d<0):`<div class="p none"><span class="st">Paiz</span><span class="v">—</span><span class="pn">no lo tiene igual</span></div>`}${x.c?pillB("c",x.c,d!=null&&d>0):`<div class="p none"><span class="st">La Colonia</span><span class="v">—</span><span class="pn">no lo tiene igual</span></div>`}</div>`;
  }
  let tag="";
  if(both&&f!=="p"&&f!=="c"){tag=d===0?`<span class="badge eq">Mismo precio</span>`:`<span class="badge ok">${ST[d<0?"p":"c"].n} ahorra ${money(Math.abs(d))} (${(Math.abs(d)/Math.max(x.p[0],x.c[0])*100).toFixed(0)}%)</span>`}
  const inCart=!!cart[x.id];
  const alt=both&&x.p[7]!==x.c[7]&&norm(x.p[7])!==norm(x.c[7])&&f!=="p"&&f!=="c"?`<div class="alt">En La Colonia: ${esc(x.c[7])}</div>`:"";
  return`<article class="card item"><div class="im">${im?`<img loading="lazy" referrerpolicy="no-referrer" src="${esc(im)}" alt="" onerror="this.remove()">`:""}</div>
   <div class="bd"><h3>${esc(f==="c"&&x.c?x.c[7]:x.p?x.p[7]:x.c[7])}</h3>
   <div class="meta">${s[9]?`<span class="badge info">${esc(s[9])}</span>`:""}${x.x==="e"?`<span class="badge info">Mismo producto</span>`:x.x==="f"?`<span class="badge info" title="Misma marca, tamaño y nombre muy parecido">Coincidencia probable</span>`:""}${tag}</div>
   ${alt}${cuerpo}
   <div class="acts"><button class="btn" data-sim="${esc(x.id)}">${IC.find} Similares</button>
   <button class="btn ${inCart?"in":"pri"}" data-add="${esc(x.id)}">${inCart?IC.chk+" En canasta":IC.plus+" Canasta"}</button></div></div></article>`;
}
function pintarBuscar(){
  $("#qf").classList.toggle("has",!!$("#q").value);
  if(!tokens(B.q).length){
    $("#fchips").innerHTML="";$("#cnt").textContent="";
    $("#out").innerHTML=`<div class="empty"><b>¿Qué quieres comparar?</b>Escribe el nombre de un producto. Funciona igual en singular o plural (huevo / huevos).
      <div class="sug">${SUG.map(s=>`<button class="chip" data-s="${esc(s)}">${esc(s)}</button>`).join("")}</div></div>`;return}
  const {r,cnt}=buscar();
  const F=[["todas","Todas",""],["p","Paiz","pz"],["c","La Colonia","co"],["ambas","En ambas",""]];
  $("#fchips").innerHTML=F.map(([k,n,c])=>`<button class="chip ${c} ${B.f===k?"on":""}" data-f="${k}">${n}<b>${cnt[k]}</b></button>`).join("");
  $("#cnt").textContent=r.length+(r.length===1?" resultado":" resultados");
  if(!r.length){$("#out").innerHTML=`<div class="empty"><b>Sin resultados</b>${B.f!=="todas"?"Prueba con «Todas» o ":"Prueba "}con otra palabra más corta.</div>`;return}
  $("#out").innerHTML=r.slice(0,B.n).map(tarjeta).join("")+(r.length>B.n?`<button class="more" id="mas">Ver más (${r.length-B.n})</button>`:"");
}
let deb;
$("#q").oninput=()=>{clearTimeout(deb);deb=setTimeout(()=>{B.q=$("#q").value;B.n=30;pintarBuscar()},110)};
$("#qx").onclick=()=>{$("#q").value="";B.q="";pintarBuscar();$("#q").focus()};
$("#ord").onchange=()=>{B.o=$("#ord").value;B.n=30;pintarBuscar()};
$("#fchips").onclick=e=>{const b=e.target.closest("[data-f]");if(!b)return;B.f=b.dataset.f;B.n=30;pintarBuscar()};
function irBuscar(q){ver("buscar");$("#q").value=q;B.q=q;B.f="todas";B.n=30;pintarBuscar()}
$("#out").onclick=e=>{
  const s=e.target.closest("[data-s]");if(s){irBuscar(s.dataset.s);return}
  if(e.target.closest("#mas")){B.n+=30;pintarBuscar();return}
  const a=e.target.closest("[data-add]");if(a){agregar(a.dataset.add);return}
  const m=e.target.closest("[data-sim]");if(m)similares(byId.get(m.dataset.sim));
};

/* Similares: mismo tipo y tamaño parecido en la otra tienda */
function similares(x){
  const foco=B.f==="c"&&x.c?"c":x.p?"p":"c",ot=foco==="p"?"c":"p",ref=x[foco];
  const core=new Set((ref[8]||"").split(" ").filter(Boolean));
  const need=Math.max(1,Math.ceil(core.size*.5));
  const out=[];
  if(ref[3]&&ref[4]>0&&core.size)D.forEach(y=>{
    const s=y[ot];if(!s||y===x||s[3]!==ref[3]||!(s[4]>0))return;
    const ratio=s[4]/ref[4];if(ref[3]==="u"?Math.abs(ratio-1)>.01:(ratio<.5||ratio>2))return;
    let n=0;(s[8]||"").split(" ").forEach(w=>{if(core.has(w))n++});
    if(n>=need)out.push({y,s,n});
  });
  out.sort((a,b)=>(a.s[2]||1e9)-(b.s[2]||1e9));
  const top=out.slice(0,10),un=SH[ref[3]]||"";
  let h=`<h3 class="t">Similares en ${ST[ot].n}</h3>
   <div class="muted small">Del mismo tipo y tamaño parecido que «${esc(ref[7])}» (${money(ref[0])}${ref[2]?`, ${money(ref[2])}/${un}`:""} en ${ST[foco].n}). Ordenados por precio por ${LONG[ref[3]]||"unidad"}.</div>`;
  if(!top.length)h+=`<div class="empty"><b>No encontré algo parecido</b>Prueba buscando el nombre más corto en ${ST[ot].n}.</div>`;
  top.forEach(({y,s})=>{
    const dp=ref[2]&&s[2]?(s[2]-ref[2])/ref[2]*100:null;
    const b=dp==null?"":dp<-0.5?`<span class="badge ok">${Math.abs(dp).toFixed(0)}% menos por ${un}</span>`:dp>0.5?`<span class="badge bad">${dp.toFixed(0)}% más por ${un}</span>`:`<span class="badge eq">Igual por ${un}</span>`;
    h+=`<div class="sline"><div class="im">${s[6]?`<img loading="lazy" referrerpolicy="no-referrer" src="${esc(imgu(ot,s[6]))}" alt="" onerror="this.remove()">`:""}</div>
    <div class="bd"><h4>${esc(s[7])}</h4><div class="px">${money(s[0])} <em>${s[9]||""}${s[2]?` · ${money(s[2])}/${un}`:""}</em></div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px">${b}
    <button class="btn" style="height:30px;padding:0 10px" data-add="${esc(y.id)}">${IC.plus} Canasta</button>
    ${s[5]?`<a class="lnk" href="${esc(link(ot,s[5]))}" target="_blank" rel="noopener">Ver ${IC.ext}</a>`:""}</div></div></div>`;
  });
  hoja(h);
}

/* ───── CANASTA ───── */
let cart=store.get("phn_canasta",{});
Object.keys(cart).forEach(k=>{if(!byId.has(k))delete cart[k]});
const cantTotal=()=>Object.values(cart).reduce((a,b)=>a+b,0);
function badge(){const n=cantTotal(),b=$("#bg");b.textContent=n;b.classList.toggle("on",n>0)}
function guardar(){store.set("phn_canasta",cart);badge()}
function agregar(id){
  if(!byId.has(id))return;
  if(cart[id]){delete cart[id];toast("Quitado de la canasta")}else{cart[id]=1;toast("Agregado a la canasta")}
  guardar();
  if($("#v-buscar").classList.contains("on"))pintarBuscar();
  if($("#sheet").classList.contains("on")&&!$("#sb").querySelector("[data-bus]"))$$("#sb [data-add]").forEach(b=>{const on=!!cart[b.dataset.add];b.classList.toggle("in",on);b.innerHTML=on?IC.chk+" En canasta":IC.plus+" Canasta"});
}
function pintarCanasta(){
  const ids=Object.keys(cart);
  if(!ids.length){$("#cart").innerHTML=`<div class="empty"><b>Tu canasta está vacía</b>Busca productos y toca «Canasta» para sumar el total en cada tienda.
    <div class="sug"><button class="chip on" id="irb">Ir a buscar</button></div></div>`;return}
  let tp=0,tc=0,bp=0,bc=0,nb=0,solo=0,h=`<h2>Tu canasta</h2>`;
  ids.forEach(id=>{
    const x=byId.get(id),q=cart[id];
    if(x.p)tp+=x.p[0]*q;if(x.c)tc+=x.c[0]*q;
    if(x.p&&x.c){bp+=x.p[0]*q;bc+=x.c[0]*q;nb++}else solo++;
    const im=imgu(x.p?"p":"c",(x.p||x.c)[6]);
    h+=`<div class="card crow"><div class="im">${im?`<img loading="lazy" referrerpolicy="no-referrer" src="${esc(im)}" alt="" onerror="this.remove()">`:""}</div>
     <div class="bd"><h3>${esc(x.nm)}</h3><div class="pr"><span class="pz">${x.p?"Paiz "+money(x.p[0]*q):"Paiz —"}</span><span class="co">${x.c?"Colonia "+money(x.c[0]*q):"Colonia —"}</span></div></div>
     <div class="qty"><button data-q="${esc(id)}" data-d="-1" aria-label="Menos">${IC.min}</button><b>${q}</b><button data-q="${esc(id)}" data-d="1" aria-label="Más">${IC.plus}</button></div></div>`;
  });
  const dif=bp-bc,gana=dif<0?"p":"c";
  h+=`<div class="card tot"><div class="lab">Total de tu canasta</div>
   <div class="two"><div class="p pz ${nb&&dif<0?"win":""}"><span class="st">Paiz</span><span class="v">${money(tp)}</span></div>
   <div class="p co ${nb&&dif>0?"win":""}"><span class="st">La Colonia</span><span class="v">${money(tc)}</span></div></div>
   ${nb?`<div class="verdict ${dif===0?"eq":"ok"}" style="margin-top:12px">${dif===0?"Los "+nb+" productos que están en ambas cuestan lo mismo.":`En los ${nb} productos que están en las dos tiendas, ${ST[gana].n} te ahorra ${money(Math.abs(dif))}.`}</div>`:""}
   ${solo?`<div class="note">${solo} producto${solo>1?"s":""} solo está${solo>1?"n":""} en una tienda, por eso los totales no son del todo comparables. Usa «Similares» en Buscar para encontrar equivalentes.</div>`:""}
   <div class="acts" style="margin-top:12px"><button class="btn" id="vaciar">Vaciar canasta</button></div></div>`;
  $("#cart").innerHTML=h;
}
$("#cart").onclick=e=>{
  if(e.target.closest("#irb")){ver("buscar");$("#q").focus();return}
  if(e.target.closest("#vaciar")){cart={};guardar();pintarCanasta();toast("Canasta vacía");return}
  const b=e.target.closest("[data-q]");if(!b)return;
  const id=b.dataset.q,n=(cart[id]||0)+(+b.dataset.d);
  if(n<=0)delete cart[id];else cart[id]=n;guardar();pintarCanasta();
};
