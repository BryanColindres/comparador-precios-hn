name: Mantener Supabase despierto

# El plan gratuito de Supabase pausa el proyecto tras ~7 días sin actividad.
# Esta tarea hace una consulta pequeña cada 3 días para que no se pause.
on:
  schedule:
    - cron: "17 12 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta de prueba
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://apvrcuejwrkadtvnkhqc.supabase.co/rest/v1/rpc/precios_leer" \
            -H "apikey: sb_publishable_PvnpABAoEgZpm9EYLcO4PA_Hx9kU0zi" \
            -H "Content-Type: application/json" \
            -d '{"p_hogar":"mantener-despierto-0000"}')
          echo "Respuesta de Supabase: $code"
          [ "$code" = "200" ]
